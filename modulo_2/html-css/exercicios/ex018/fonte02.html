<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes Externas</title>
    <style>
        @font-face {
            font-family: 'Ka-Boing!';
            src: url(font_external/Ka-Boing!.ttf) format('truetype'), url('Ka-Boing!.ttf');
            font-family: 'KGHAPPYShadows';
            src: url(font_external/KGHAPPYSolid.ttf) format('truetype'), url('KGHAPPYShadows.ttf');
            font-weight: normal;
            font-style: normal;

            /*
                Tipos de format()
                - opentype (otf)
                - truetype (ttf)
                - embedded-opentype
                - truetype-aat (Apple Advanced Typography)
                - svg
            */
        }
        body {
            font-family:Arial, Helvetica, sans-serif
        }

        h1 {
            font-family: 'Ka-Boing!', 'KGHAPPYShadows', Times, sans-serif;
            font-size: 3em;
            font-weight: normal;
            font-style: normal;
        }
    </style>
</head>
<body>
    <h1>Olá, mundo</h1>
    <p>Lorem ipsum dolor sit, amet consectetur adipisicing elit. Eum, at repellat culpa exercitationem similique esse quibusdam in fugiat. Ducimus possimus reiciendis omnis tempora fuga ex quae voluptatibus itaque beatae nulla!</p>
</body>
</html>
