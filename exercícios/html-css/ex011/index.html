<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídias em HTML5</title>
</head>
<body>
    <h1>Imagem dinâmica</h1>
    <p>Tente abrir esse site em vários dispositivos diferentes ou simplesmente aumente e diminua o tamanho do seu navegador.</p>

    <picture>
        <!-- ESTÁ TAG 'PICTURE' FUNCIONA COMO UM GENRENCIADOR INTELIGENTE DE IMAGENS. ELE VAI ANALISAR O TAMANHO DA TELA DO USUÁRIO E CARREGAR A IMAGEM MAIS ADEQUADA PARA AQUELE DISPOSITIVO. -->

        <source media="(max-width: 750px)" srcset="imagens/foto-p.png" type="image/png">

        <!-- As tags <source> servem apenas para fornecer as alternativas e regras de
        seleção. O estilo CSS e as propriedades de renderização devem ser aplicados diretamente na tag
        <img>. -->

        <source media="(max-width: 1050px)" srcset="imagens/foto-m.png" type="image/png">
        <img src="imagens/foto-g.png" alt="Imagem Fléxivel">
    </picture>

    <h1>Reproduzindo Áudio</h1>
    <p>Vamos aprender a reproduzir áudios em HTML5.</p>
    <audio preload="metadata" autoplay controls>
        <source src="midia/guanacast-33.mp3" type="audio/mpeg">
        <source src="midia/guanacast-33.ogg" type="audio/ogg">
        <source src="midia/guanacast-33.wav" type="audio/wav">
        <p>Seu navegador não consegue reproduzir áudio. <a href="midia/guanacast-33.mp3">Clique aqui para baixar o arquivo MP3</a></p>
    </audio>
    <!-- COMPARTIBILIDADE DE ARQUIVOS DE ÁUDIO COM OS NAVEGADORES: MP3 WAV OGG -->
</body>
</html>
